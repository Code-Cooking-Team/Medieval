name: Deploy to gh-pages

on:
  push:
    branches: ['main']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Setup Bun 🥖
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies 📥
        run: bun install

      - name: Lint 🔍
        run: bun run lint

      - name: Type check 🔍
        run: bun run ts

      - name: Run tests 🧪
        run: bun run test

      - name: Build 🔧
        run: bun run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
