name: Deploy to gh-pages

on:
  push:
    branches: ['main']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js 🟢
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies 📥
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check 🔍
        run: bun run ts

      - name: Run tests 🧪
        run: bun run test

      - name: Build 🔧
        run: bun run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: dist
