name: Deploy to gh-pages

on:
  push:
    branches: ['main']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js 🟢
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Setup pnpm 📦
        uses: pnpm/action-setup@v6.1.1

      - name: Install dependencies 📥
        run: pnpm install --frozen-lockfile

      - name: Type check 🔍
        run: pnpm ts

      - name: Run tests 🧪
        run: pnpm test --run

      - name: Build 🔧
        run: pnpm build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: dist
